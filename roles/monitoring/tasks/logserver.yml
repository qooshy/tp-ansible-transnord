---
- name: Réception des journaux de tous les serveurs
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/10-central.conf
    mode: "0644"
    content: |
      # Géré par Ansible - un dossier par serveur, un fichier par programme.
      module(load="imtcp")
      template(name="ParServeur" type="string"
               string="/var/log/central/%HOSTNAME%/%PROGRAMNAME:::secpath-replace%.log")
      ruleset(name="distant") {
        action(type="omfile" dynaFile="ParServeur" createDirs="on"
               dirCreateMode="0750" fileCreateMode="0640" fileGroup="adm")
        stop
      }
      input(type="imtcp" port="514" ruleset="distant")
      # Les exécutions d'Ansible (qui a lancé quoi, quand) dans un fichier dédié
      if $programname == 'ansible-run' then {
        action(type="omfile" file="/var/log/central/ansible-executions.log" fileGroup="adm")
      }
  notify: Redémarrer rsyslog

- name: Conservation des journaux 3 mois (MC15)
  ansible.builtin.copy:
    dest: /etc/logrotate.d/central
    mode: "0644"
    content: |
      /var/log/central/*.log /var/log/central/*/*.log {
          weekly
          rotate 13
          compress
          delaycompress
          missingok
          notifempty
          sharedscripts
          postrotate
              /usr/lib/rsyslog/rsyslog-rotate
          endscript
      }
