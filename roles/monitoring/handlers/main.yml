---
- name: Redémarrer blackbox
  ansible.builtin.systemd: { name: prometheus-blackbox-exporter, state: restarted, daemon_reload: true }

- name: Recharger prometheus
  ansible.builtin.service: { name: prometheus, state: reloaded }

- name: Redémarrer prometheus
  ansible.builtin.service: { name: prometheus, state: restarted }

- name: Redémarrer alertmanager
  ansible.builtin.service: { name: prometheus-alertmanager, state: restarted }

- name: Redémarrer grafana
  ansible.builtin.service: { name: grafana-server, state: restarted }

- name: Redémarrer mailpit
  ansible.builtin.systemd: { name: mailpit, state: restarted, daemon_reload: true }

- name: Redémarrer rsyslog
  ansible.builtin.service: { name: rsyslog, state: restarted }
