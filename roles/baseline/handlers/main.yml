---
- name: Redémarrer chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Redémarrer w32time
  ansible.windows.win_service:
    name: W32Time
    state: restarted

- name: Resynchroniser w32time
  ansible.windows.win_command: w32tm /resync /force
  changed_when: false
  listen: Redémarrer w32time
