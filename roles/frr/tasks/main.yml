---
- name: Installation de FRR
  ansible.builtin.apt:
    name: frr
    update_cache: true
    cache_valid_time: 3600

- name: Activation d'ospfd
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^ospfd='
    line: ospfd=yes
  notify: Redémarrer frr

- name: Configuration FRR
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Redémarrer frr

- name: Service frr
  ansible.builtin.service:
    name: frr
    enabled: true
    state: started
