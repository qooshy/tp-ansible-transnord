---
# MC6 : les Debian reconnaissent les comptes de l'annuaire.
# Prérequis : DNS vers les DC et heure synchronisée sur eux (chrony, via baseline).
- name: DNS = les contrôleurs de domaine (celui du site d'abord)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible (dépôt loginord-infra)
      search {{ ad_domain }}
      {% for ip in dns_servers %}
      nameserver {{ ip }}
      {% endfor %}

- name: Les briques côté Debian
  ansible.builtin.apt:
    name: [realmd, sssd, sssd-tools, adcli, krb5-user, libnss-sss, libpam-sss, packagekit, oddjob-mkhomedir]
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Kerberos
  ansible.builtin.copy:
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible (dépôt loginord-infra)
      [libdefaults]
          default_realm = {{ ad_domain | upper }}
          dns_lookup_kdc = true
          dns_lookup_realm = false
          rdns = false

- name: Déjà dans le domaine ?
  ansible.builtin.command: realm list --name-only
  register: realm_list
  changed_when: false

- name: Jonction au domaine, objet ordinateur rangé dans l'OU Serveurs du site
  ansible.builtin.command:
    cmd: >-
      realm join --user=Administrator
      --computer-ou="OU=Serveurs,OU={{ site_name }},OU={{ ad_root_ou | default('LogiNord') }},{{ ad_base_dn }}"
      {{ ad_domain }}
    stdin: "{{ vault_ad_join_password }}"
  when: ad_domain not in realm_list.stdout
  no_log: true
  changed_when: true

- name: Réglages de SSSD
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Redémarrer sssd

- name: Répertoire personnel créé à la première connexion
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  register: mkhome
  changed_when: false

- name: sudo pour le groupe AD des admins Linux (et lui seul)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ad-admins
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
    content: |
      # Géré par Ansible (dépôt loginord-infra) - MC6 : les droits Linux viennent des groupes AD
      Defaults:%{{ ad_linux_admin_group | lower }} log_output
      %{{ ad_linux_admin_group | lower }} ALL=(ALL:ALL) ALL

- name: Appliquer
  ansible.builtin.meta: flush_handlers
