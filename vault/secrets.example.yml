---
# Le coffre-fort, version vide. On le copie, on le remplit, on le chiffre :
#   cp vault/secrets.example.yml vault/secrets.yml
#   ansible-vault encrypt vault/secrets.yml
#
# Le mot de passe Administrator de TOUS les Windows.
# À la création de la forêt, il devient celui de l'admin du domaine :
# le même sur DC01 et DC02, sinon DC02 restera à la porte.
vault_win_password: "A_CHANGER"
# Le mot de passe de lnadmin, le compte que baseline crée sur les Windows
vault_admin_password: "A_CHANGER"
# Le mot de passe DSRM, celui qu'on espère ne jamais devoir taper
vault_dsrm_password: "A_CHANGER"
# Le premier mot de passe des cobayes AD
vault_ad_user_password: "A_CHANGER"
# Les clés privées WireGuard (sorties de wg genkey), elles ne quittent jamais le vault
vault_wg_rtr_a: "A_GENERER"
vault_wg_rtr_b: "A_GENERER"
# ... et leurs clés publiques (wg pubkey < clé privée), lues par l'autre routeur
vault_wg_pub_rtr_a: "A_GENERER"
vault_wg_pub_rtr_b: "A_GENERER"

# ===== Ajouts MC6 à MC15 =====
# Compte qui joint les Debian au domaine (realm join) : l'Administrator du domaine
vault_ad_join_password: "A_CHANGER"
# Annuaire des prestataires (OpenLDAP) : admin, compte de lecture pour SSSD, mot de passe initial
vault_ldap_admin_password: "A_CHANGER"
vault_ldap_sssd_password: "A_CHANGER"
vault_presta_password: "A_CHANGER"
# TrackR : base PostgreSQL et signature des sessions (openssl rand -hex 32)
vault_trackr_db_password: "A_CHANGER"
vault_trackr_secret: "A_GENERER"
# Mode local de TrackR (labo sans AD uniquement), format admin:motdepasse
vault_trackr_local_users: "admin:A_CHANGER"
# Sauvegardes chiffrées vers bkp01
vault_borg_passphrase: "A_CHANGER"
# Supervision
vault_grafana_admin_password: "A_CHANGER"
vault_discord_webhook: ""
