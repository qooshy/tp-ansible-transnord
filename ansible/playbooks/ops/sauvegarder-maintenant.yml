# Lance une sauvegarde immédiate (par exemple avant une intervention).
#   bash scripts/deploy playbooks/ops/sauvegarder-maintenant.yml [--limit web01]
- name: Sauvegarde immédiate
  hosts: linux
  gather_facts: false
  tasks:
    - name: Sauvegarde
      ansible.builtin.command: /usr/local/sbin/sauvegarde
      register: res
      changed_when: true

    - name: Résultat
      ansible.builtin.debug:
        msg: "{{ res.stdout_lines | last }}"
