# Restaure la base TrackR depuis la dernière sauvegarde (serveur de Lille).
#   bash scripts/deploy playbooks/ops/restaurer-trackr.yml
# Optionnel : -e archive=web01-2026-11-08_0130 pour une sauvegarde précise.
- name: Trouver le serveur TrackR principal
  hosts: trackr
  gather_facts: false
  tasks:
    - name: Rôle de la base
      ansible.builtin.command: psql -tAc "SELECT pg_is_in_recovery()"
      become_user: postgres
      register: rec
      changed_when: false

    - name: Principal
      ansible.builtin.group_by:
        key: "trackr_{{ 'secours' if rec.stdout == 't' else 'principal' }}"

- name: Restauration
  hosts: trackr_principal
  gather_facts: false
  environment:
    BORG_REPO: "ssh://borg@{{ groups['backup_servers'][0] }}.{{ domain_fqdn }}/srv/borg/depots/{{ inventory_hostname }}"
    BORG_PASSCOMMAND: cat /root/.borg-passphrase
    BORG_RSH: ssh -i /root/.ssh/id_sauvegarde -o BatchMode=yes
  tasks:
    - name: Dernière sauvegarde disponible
      ansible.builtin.command: borg list --short --last 1
      register: last
      changed_when: false
      when: archive is not defined

    - name: Archive retenue
      ansible.builtin.set_fact:
        chosen: "{{ archive | default(last.stdout | trim) }}"

    - name: Extraction de l'export de la base
      ansible.builtin.command: borg extract "::{{ chosen }}" var/backups/transnord/trackr.dump
      args:
        chdir: /tmp
      changed_when: true

    - name: Export lisible par PostgreSQL
      ansible.builtin.file:
        path: /tmp/var
        owner: postgres
        recurse: true

    - name: Remise en place des données
      ansible.builtin.command: pg_restore --clean --if-exists -d trackr /tmp/var/backups/transnord/trackr.dump
      become_user: postgres
      changed_when: true

    - name: Nettoyage
      ansible.builtin.file:
        path: /tmp/var
        state: absent

    - name: Nombre de passages restaurés
      ansible.builtin.command: psql -d trackr -tAc "SELECT count(*) FROM events"
      become_user: postgres
      register: n
      changed_when: false

    - name: Trace
      ansible.builtin.shell: logger -t restauration "Base TrackR restaurée depuis {{ chosen }} ({{ n.stdout }} passages)"
      changed_when: false

    - name: Résultat
      ansible.builtin.debug:
        msg: "Base TrackR restaurée depuis {{ chosen }} : {{ n.stdout }} passages retrouvés (copie de secours mise à jour automatiquement)."
