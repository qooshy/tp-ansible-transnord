# Après une bascule TrackR, l'ancien serveur principal a une base périmée.
# Ce playbook le transforme en copie du NOUVEAU principal (5 minutes).
#   bash scripts/deploy playbooks/ops/trackr-reconstruire-secours.yml -e serveur=web01
- name: Vérifications
  hosts: trackr
  gather_facts: false
  tasks:
    - name: Le serveur à reconstruire est précisé
      ansible.builtin.assert:
        that: serveur is defined and serveur in groups['trackr']
        fail_msg: "Préciser -e serveur=<web01|web02> (le serveur qui a été en panne)"
      run_once: true

    - name: Celui qui porte l'adresse TrackR est le principal
      ansible.builtin.command: ip -br addr
      register: ips
      changed_when: false

    - name: Le serveur à reconstruire ne doit pas porter l'adresse TrackR
      ansible.builtin.assert:
        that: trackr_vip not in hostvars[serveur].ips.stdout
        fail_msg: "{{ serveur }} porte l'adresse TrackR : c'est lui le principal, on ne l'écrase pas."
      run_once: true

- name: Reconstruction
  hosts: "{{ serveur }}"
  vars:
    trackr_force_clone: true
    trackr_primary_override: "{{ groups['trackr'] | reject('eq', serveur) | first }}"
  tasks:
    - name: Rôle TrackR, en recopiant la base depuis le principal
      ansible.builtin.include_role:
        name: trackr
        tasks_from: rebuild.yml
