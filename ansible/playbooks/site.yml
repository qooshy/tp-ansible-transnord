# =====================================================================
# Déploiement COMPLET de l'infrastructure TransNord, dans l'ordre.
# Relançable à volonté : il ne change que ce qui n'est pas conforme.
#   bash scripts/deploy playbooks/site.yml
#   bash scripts/deploy playbooks/site.yml --limit web02     (un seul serveur)
#   bash scripts/deploy playbooks/site.yml --tags identites  (une seule partie)
# =====================================================================

- name: 1. Autorité de certification interne
  hosts: control
  gather_facts: false
  become: false
  tags: [pki]
  roles: [pki]

- name: 2. Active Directory - premier contrôleur (crée le domaine, les sites, le partage Paie)
  hosts: "{{ groups['domain_controllers'] | first }}"
  tags: [ad]
  roles: [samba_dc]

- name: 3. Active Directory - contrôleurs des autres sites
  hosts: "domain_controllers:!{{ groups['domain_controllers'] | first }}"
  serial: 1
  tags: [ad]
  roles: [samba_dc]

- name: 4. Annuaire - salariés, groupes, DNS (depuis personnel.csv)
  hosts: "{{ groups['domain_controllers'] | first }}"
  tags: [ad, identites]
  roles: [ad_objects]

- name: 5. Socle Linux (nom, heure et DNS vers les DC, durcissement, traces)
  hosts: linux
  tags: [socle, linux]
  roles: [common]

- name: 6. Serveurs Linux dans le domaine (realm join, sudo GG_Admins_Linux)
  hosts: linux:!domain_controllers
  tags: [ad_linux, identites]
  roles: [linux_ad_join]

- name: 7. Annuaire des prestataires (OpenLDAP)
  hosts: ldap_servers
  tags: [ldap, identites]
  roles: [openldap]

- name: 8. Supervision et journaux centraux
  hosts: monitoring
  tags: [supervision]
  roles: [monitoring]

- name: 9. TrackR (2 serveurs + adresse flottante)
  hosts: trackr
  tags: [trackr]
  roles: [trackr]

- name: 10. Sauvegardes (serveur à Lille)
  hosts: backup_servers
  tags: [sauvegarde]
  roles: [backup_server]

- name: 11. Sauvegardes (tous les serveurs Linux)
  hosts: linux
  tags: [sauvegarde]
  roles: [backup_client]

- name: 12. VPN des informaticiens
  hosts: control
  tags: [vpn, identites]
  roles: [wireguard]

- name: 13. Contrôles finaux
  ansible.builtin.import_playbook: verifier.yml
