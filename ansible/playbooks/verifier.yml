# Contrôles de bon fonctionnement, lisibles par un humain. À lancer quand on
# veut : après un déploiement, après une panne, avant une démonstration.
#   bash scripts/deploy playbooks/verifier.yml
- name: Contrôles depuis les serveurs Linux
  hosts: linux:!domain_controllers
  gather_facts: false
  tags: [verifier]
  tasks:
    - name: Heure synchronisée sur un contrôleur de domaine
      ansible.builtin.shell: chronyc -n sources | grep -E '^\^\*'
      changed_when: false

    - name: Le DNS de l'annuaire répond
      ansible.builtin.command: getent hosts {{ trackr_fqdn }}
      changed_when: false

    - name: Serveur bien joint au domaine
      ansible.builtin.command: realm list --name-only
      register: realm
      changed_when: false
      failed_when: domain_fqdn not in realm.stdout

    - name: Un informaticien (GG_Admins_Linux) a le droit sudo
      ansible.builtin.command: sudo -l -U {{ check_admin }}
      register: sudo_admin
      changed_when: false
      failed_when: "'(ALL : ALL) ALL' not in sudo_admin.stdout"

    - name: Un autre salarié n'a AUCUN droit sudo
      ansible.builtin.command: sudo -l -U {{ check_non_admin }}
      register: sudo_other
      changed_when: false
      failed_when: "'(ALL : ALL) ALL' in sudo_other.stdout"
  vars:
    check_admin: "{{ (employees | selectattr('statut', 'eq', 'actif') | selectattr('service', 'eq', 'informatique') | first).identifiant }}"
    check_non_admin: "{{ (employees | selectattr('statut', 'eq', 'actif') | selectattr('service', 'eq', 'quai') | first).identifiant }}"

- name: Contrôles des services
  hosts: control
  gather_facts: false
  become: false
  tags: [verifier]
  tasks:
    - name: TrackR répond sur son adresse flottante
      ansible.builtin.uri:
        url: "https://{{ trackr_fqdn }}/health"
        return_content: true
      register: trackr
      changed_when: false

    - name: Paie - la comptabilité est REFUSÉE
      ansible.builtin.shell: >
        smbclient //{{ pdc }}.{{ domain_fqdn }}/Paie -U '{{ domain_netbios }}\{{ compta_user }}%{{ vault_users_initial_password }}' --client-protection=encrypt -c ls
      register: paie_compta
      changed_when: false
      failed_when: "'NT_STATUS_ACCESS_DENIED' not in (paie_compta.stdout + paie_compta.stderr)"
      no_log: true

    - name: Paie - les RH y ont accès
      ansible.builtin.shell: >
        smbclient //{{ pdc }}.{{ domain_fqdn }}/Paie -U '{{ domain_netbios }}\{{ rh_user }}%{{ vault_users_initial_password }}' --client-protection=encrypt -c ls
      register: paie_rh
      changed_when: false
      failed_when: "'Fiche_paie' not in paie_rh.stdout"
      no_log: true

    - name: Résumé
      ansible.builtin.debug:
        msg:
          - "TrackR : {{ trackr.json.status }} (servi par {{ trackr.json.node }}, base {{ trackr.json.db_role }})"
          - "Paie : RH autorisés, comptabilité refusée - OK"
          - "Supervision : http://{{ hostvars[groups['monitoring'][0]].ansible_host }}:3000"
          - "Alertes (boîte mail) : http://{{ hostvars[groups['monitoring'][0]].ansible_host }}:8025"
  vars:
    compta_user: "{{ (employees | selectattr('statut', 'eq', 'actif') | selectattr('service', 'eq', 'compta') | first).identifiant }}"
    rh_user: "{{ (employees | selectattr('statut', 'eq', 'actif') | selectattr('service', 'eq', 'rh') | first).identifiant }}"
