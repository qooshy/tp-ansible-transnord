# DÉMONSTRATION : un sinistre efface toutes les expéditions de TrackR
# (erreur humaine, logiciel malveillant...). On restaure ensuite avec
# playbooks/ops/restaurer-trackr.yml.
- name: Sinistre simulé sur la base TrackR
  hosts: trackr
  gather_facts: false
  tasks:
    - name: Seul le serveur principal accepte l'écriture
      ansible.builtin.command: psql -tAc "SELECT pg_is_in_recovery()"
      become_user: postgres
      register: rec
      changed_when: false

    - name: Effacement de toutes les expéditions
      ansible.builtin.command: psql -d trackr -c "TRUNCATE events"
      become_user: postgres
      when: rec.stdout == 'f'
      changed_when: true

    - name: Message
      ansible.builtin.debug:
        msg: "Toutes les expéditions ont été effacées. Rafraîchir TrackR : la liste est vide."
      run_once: true
