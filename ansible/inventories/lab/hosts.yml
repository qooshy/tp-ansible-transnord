# Inventaire du laboratoire TransNord.
# Rangé deux fois : par SITE (où est la machine) et par RÔLE (à quoi elle sert).
# vm_memory / vm_cpus ne servent qu'à Vagrant pour créer les VM.
#
# Ajouter un site = ajouter un groupe site_<nom> (+ son sous-réseau dans
# group_vars/all/main.yml) et y placer au moins un contrôleur de domaine.
all:
  children:

    # ---------------------------------------------------------------- SITES
    site_dunkerque:          # salle serveur principale (quai, exploitation)
      hosts:
        dc01:   { ansible_host: 192.168.56.11, vm_memory: 512 }
        ldap01: { ansible_host: 192.168.56.12, vm_memory: 384 }
        web01:  { ansible_host: 192.168.56.21, vm_memory: 512 }
        web02:  { ansible_host: 192.168.56.22, vm_memory: 512 }
        ops01:  { ansible_host: 192.168.56.10, vm_memory: 896, vm_cpus: 2 }
    site_lille:              # siège (direction, RH, compta, informatique)
      hosts:
        dc02:   { ansible_host: 192.168.56.71, vm_memory: 512 }
        bkp01:  { ansible_host: 192.168.56.72, vm_memory: 384 }

    # ---------------------------------------------------------------- SYSTÈMES
    linux:
      hosts: { dc01: , dc02: , ops01: , ldap01: , web01: , web02: , bkp01: }
    windows:                 # aucun serveur Windows : l'annuaire AD tourne sous Samba
      hosts: {}

    # ---------------------------------------------------------------- RÔLES
    domain_controllers:      # Active Directory (Samba AD) + DNS + heure
      hosts: { dc01: , dc02: }
    ldap_servers:            # annuaire des prestataires
      hosts: { ldap01: }
    trackr:                  # application de suivi des expéditions (en paire)
      hosts: { web01: , web02: }
    control:                 # Ansible, VPN des informaticiens, bastion SSH
      hosts: { ops01: }
    monitoring:              # supervision, alertes, journaux centralisés
      hosts: { ops01: }
    backup_servers:          # sauvegardes hors site (Lille)
      hosts: { bkp01: }
