# ops01 : Ansible, VPN des informaticiens, supervision, journaux centraux.
vpn_port: 51820
vpn_public_endpoint: "vpn.transnord.example:{{ vpn_port }}"   # adresse publique (box internet de Dunkerque)
vpn_server_ip: 10.99.0.1

firewall_allow:
  - { port: "{{ vpn_port }}", proto: udp, comment: "VPN WireGuard" }
  - { port: 514, from: "{{ lab_cidr }}", comment: "journaux centralises" }
  - { port: 3000, from: "{ {{ lab_cidr }}, {{ vpn_cidr }} }", comment: "Grafana" }
  - { port: 8025, from: "{ {{ lab_cidr }}, {{ vpn_cidr }} }", comment: "boite mail des alertes" }
  - { port: 9090, from: "{ {{ lab_cidr }}, {{ vpn_cidr }} }", comment: "Prometheus" }
  - { port: 9093, from: "{ {{ lab_cidr }}, {{ vpn_cidr }} }", comment: "Alertmanager" }

# Depuis le VPN, un informaticien n'atteint que les ports d'administration.
firewall_forward_rules:
  - ct state established,related accept
  - iifname "wg0" ip daddr {{ lab_cidr }} tcp dport { 22, 443, 3389, 5985, 5986 } accept
firewall_nat_rules:
  - ip saddr {{ vpn_cidr }} oifname "{{ lab_iface }}" masquerade

# Sauvegarde de l'autorité de certification et des tableaux de bord
backup_extra_paths: [/var/lib/transnord-pki, /var/lib/grafana/grafana.db]
