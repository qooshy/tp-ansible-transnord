# =====================================================================
# Identités : la liste des personnes est tenue par les RH dans
# inventories/<env>/personnel.csv (s'ouvre dans Excel).
#   - un changement de poste  = modifier la colonne "service"
#   - un départ               = statut "parti" (compte désactivé partout)
#   - un prestataire          = service "prestataire" + date de fin de mission
# Ce fichier décrit seulement ce que donne chaque service.
# =====================================================================
services:
  direction:    { ou: Direction,    groups: [GG_Direction] }
  rh:           { ou: RH,           groups: [GG_RH] }
  compta:       { ou: Comptabilite, groups: [GG_Compta] }
  informatique: { ou: Informatique, groups: [GG_Informatique, GG_Admins_Linux] }
  quai:         { ou: Quai,         groups: [GG_Quai] }
  exploitation: { ou: Exploitation, groups: [GG_Exploitation] }

ad_groups:
  GG_Direction:    Direction générale
  GG_RH:           Ressources humaines
  GG_Compta:       Comptabilité
  GG_Informatique: Service informatique
  GG_Admins_Linux: Administrateurs des serveurs Linux (sudo)
  GG_Quai:         Agents de quai (Dunkerque)
  GG_Exploitation: Exploitation des camions (Dunkerque)

# Qui a accès aux fiches de paie (partage \dc01\Paie) : RH et Direction, point.
paie_groups: [GG_RH, GG_Direction]

# Droits dans TrackR selon le groupe AD
trackr_writer_groups: [GG_Quai, GG_Exploitation]
trackr_reader_groups: [GG_Direction, GG_Informatique, GG_Compta]

# --- Lecture du fichier RH (ne pas modifier) ---------------------------
personnel: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/personnel.csv') | community.general.from_csv(delimiter=';') }}"
employees: "{{ personnel | rejectattr('service', 'eq', 'prestataire') | list }}"
prestataires: "{{ personnel | selectattr('service', 'eq', 'prestataire') | list }}"
