# =====================================================================
# Paramètres globaux de l'entreprise. C'est le premier fichier à lire.
# =====================================================================
org_name: TransNord

# --- Domaine Active Directory (un seul identifiant par personne) -------
domain_fqdn: transnord.lan
domain_realm: TRANSNORD.LAN
domain_netbios: TRANSNORD
domain_dn: DC=transnord,DC=lan
ad_root_ou: "OU={{ org_name }},{{ domain_dn }}"

# --- Annuaire des prestataires (OpenLDAP, séparé de l'AD) --------------
ldap_base_dn: dc=transnord,dc=lan
ldap_fqdn: "ldap01.{{ domain_fqdn }}"

# --- Sites : ajouter un site = une entrée ici + un groupe dans hosts.yml
sites:
  dunkerque: { label: Dunkerque, subnet: 192.168.56.0/26 }
  lille:     { label: Lille,     subnet: 192.168.56.64/26 }

# --- Réseaux ------------------------------------------------------------
lab_cidr: 192.168.56.0/24      # réseau des serveurs
vpn_cidr: 10.99.0.0/24         # postes des informaticiens connectés au VPN

# --- Heure et résolution de noms ---------------------------------------
timezone_linux: Europe/Paris
timezone_windows: Romance Standard Time
ntp_upstream: [0.fr.pool.ntp.org, 1.fr.pool.ntp.org]   # source externe des DC
dns_forwarders: [10.0.2.3]     # labo : DNS de VirtualBox ; en prod : DNS du FAI

# --- Services ----------------------------------------------------------
trackr_vip: 192.168.56.20      # adresse flottante : toujours le serveur TrackR vivant
trackr_fqdn: "trackr.{{ domain_fqdn }}"
alert_email: "informatique@{{ domain_fqdn }}"
pki_dir: /var/lib/transnord-pki          # sur ops01 : autorité de certification interne
ca_cert_name: transnord-ca

# =====================================================================
# Valeurs calculées (ne pas modifier)
# =====================================================================
fqdn: "{{ inventory_hostname }}.{{ domain_fqdn }}"
site: "{{ (group_names | select('match', '^site_') | first | default('site_aucun'))[5:] }}"
site_dcs: "{{ groups['domain_controllers'] | select('in', groups['site_' ~ site] | default([])) | list }}"
# DC du site d'abord : si la liaison inter-sites tombe, chaque site reste autonome.
preferred_dcs: "{{ site_dcs + (groups['domain_controllers'] | reject('in', site_dcs) | list) }}"
dns_servers: "{{ preferred_dcs | map('extract', hostvars, 'ansible_host') | list }}"
ntp_servers: "{{ preferred_dcs | map('regex_replace', '$', '.' ~ domain_fqdn) | list }}"
pdc: "{{ groups['domain_controllers'] | first }}"
# Carte réseau qui porte l'adresse du réseau serveurs (eth1 dans le labo)
lab_iface: >-
  {{ ansible_interfaces | map('regex_replace', '-', '_') | map('regex_replace', '^', 'ansible_')
     | map('extract', hostvars[inventory_hostname]) | selectattr('ipv4', 'defined')
     | selectattr('ipv4.address', 'eq', ansible_host) | map(attribute='device') | first }}
