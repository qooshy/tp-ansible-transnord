# Configuration Ansible du dépôt TransNord (lue automatiquement depuis ce dossier).
[defaults]
inventory            = inventories/lab/hosts.yml
roles_path           = roles
collections_path     = /opt/ansible/collections
vault_password_file  = .vault_pass
interpreter_python   = auto_silent
forks                = 5
timeout              = 30
stdout_callback      = default
callback_result_format = yaml
display_skipped_hosts = false
# Chaque exécution est aussi journalisée (qui / quoi / quand) par scripts/deploy.
log_path             = ~/ansible.log

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
