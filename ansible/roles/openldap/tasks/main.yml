# Annuaire des PRESTATAIRES (OpenLDAP), séparé de l'AD des salariés :
# un prestataire n'a jamais de compte dans l'annuaire interne.
# - installation sans aucune question (debconf pré-rempli)
# - connexions chiffrées obligatoires (LDAPS 636 / StartTLS 389)
# - un prestataire ne peut lire QUE sa propre fiche
# - compte verrouillé automatiquement à la date de fin de mission
- name: slapd déjà installé ?
  ansible.builtin.command: dpkg-query -W -f='${Status}' slapd
  register: slapd_pkg
  changed_when: false
  failed_when: false

- name: Réponses d'installation pré-remplies (aucune question)
  when: "'install ok installed' not in slapd_pkg.stdout"
  ansible.builtin.debconf:
    name: slapd
    question: "{{ item.q }}"
    value: "{{ item.v }}"
    vtype: "{{ item.t }}"
  loop:
    - { q: slapd/no_configuration, t: boolean, v: "false" }
    - { q: slapd/domain, t: string, v: "{{ domain_fqdn }}" }
    - { q: shared/organization, t: string, v: "{{ org_name }}" }
    - { q: slapd/password1, t: password, v: "{{ vault_ldap_admin_password }}" }
    - { q: slapd/password2, t: password, v: "{{ vault_ldap_admin_password }}" }
    - { q: slapd/purge_database, t: boolean, v: "true" }
    - { q: slapd/move_old_database, t: boolean, v: "true" }
  loop_control: { label: "{{ item.q }}" }
  no_log: true

- name: Installation de slapd
  ansible.builtin.apt:
    name: [slapd, ldap-utils, python3-ldap]
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Dossier des certificats
  ansible.builtin.file:
    path: /etc/ldap/tls
    state: directory
    owner: root
    group: openldap
    mode: "0750"

- name: Certificats TLS
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "/etc/ldap/tls/{{ item.dest }}"
    owner: root
    group: openldap
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ ca_cert_name }}.crt", dest: ca.crt, mode: "0644" }
    - { src: "{{ inventory_hostname }}.crt", dest: server.crt, mode: "0644" }
    - { src: "{{ inventory_hostname }}.key", dest: server.key, mode: "0640" }
  loop_control: { label: "{{ item.dest }}" }
  notify: Redémarrer slapd

- name: Écoute LDAP (StartTLS), LDAPS et socket locale
  ansible.builtin.lineinfile:
    path: /etc/default/slapd
    regexp: '^SLAPD_SERVICES='
    line: 'SLAPD_SERVICES="ldap:/// ldaps:/// ldapi:///"'
  notify: Redémarrer slapd

- name: Activer TLS
  community.general.ldap_attrs:
    dn: cn=config
    attributes:
      olcTLSCACertificateFile: /etc/ldap/tls/ca.crt
      olcTLSCertificateFile: /etc/ldap/tls/server.crt
      olcTLSCertificateKeyFile: /etc/ldap/tls/server.key
      olcTLSProtocolMin: "3.3"
      olcLogLevel: stats
      olcLocalSSF: "128"
    state: exact

- name: Appliquer la configuration réseau
  ansible.builtin.meta: flush_handlers

- name: Module de politique de mots de passe (verrouillage des comptes)
  community.general.ldap_attrs:
    dn: cn=module{0},cn=config
    attributes:
      olcModuleLoad: ppolicy
    state: present

- name: Droits d'accès et chiffrement obligatoire
  community.general.ldap_attrs:
    dn: olcDatabase={1}mdb,cn=config
    attributes:
      olcSecurity: ssf=71        # TLS ou socket locale ; LDAP en clair sur le réseau refusé
      olcAccess:
        - >-
          {0}to * by dn.exact=gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth manage by * break
        - >-
          {1}to attrs=userPassword by self =xw by anonymous auth by * none
        - >-
          {2}to attrs=shadowLastChange,pwdAccountLockedTime by self read by * none
        - >-
          {3}to dn.subtree="ou=prestataires,{{ ldap_base_dn }}" by self read by * none
        - >-
          {4}to * by * none
    ordered: true
    state: exact
  notify: Redémarrer slapd

- name: Appliquer les règles de sécurité (prises en compte au redémarrage)
  ansible.builtin.meta: flush_handlers

- name: Branches de l'annuaire
  community.general.ldap_entry:
    dn: "{{ item.dn }}"
    objectClass: "{{ item.oc }}"
    attributes: "{{ item.attrs | default({}) }}"
  loop:
    - { dn: "ou=prestataires,{{ ldap_base_dn }}", oc: [organizationalUnit], attrs: { description: "Prestataires externes (accès limité à la mission)" } }
    - { dn: "ou=policies,{{ ldap_base_dn }}", oc: [organizationalUnit] }
    - dn: "cn=default,ou=policies,{{ ldap_base_dn }}"
      oc: [organizationalRole, pwdPolicy]
      attrs: { pwdAttribute: userPassword, pwdMinLength: "12", pwdMaxFailure: "5", pwdLockout: "TRUE", pwdLockoutDuration: "900" }
  loop_control: { label: "{{ item.dn }}" }

- name: Overlay ppolicy
  community.general.ldap_entry:
    dn: olcOverlay={0}ppolicy,olcDatabase={1}mdb,cn=config
    objectClass: [olcOverlayConfig, olcPPolicyConfig]
    attributes:
      olcOverlay: "{0}ppolicy"
      olcPPolicyDefault: "cn=default,ou=policies,{{ ldap_base_dn }}"
      olcPPolicyHashCleartext: "TRUE"

- name: Prestataires
  ansible.builtin.include_tasks: prestataire.yml
  loop: "{{ prestataires }}"
  loop_control:
    loop_var: presta
    label: "{{ presta.identifiant }} (fin {{ presta.fin_mission }})"

- name: Verrouillage automatique quotidien (même si personne ne lance Ansible)
  ansible.builtin.template:
    src: prestataires-expiration.sh.j2
    dest: /usr/local/sbin/prestataires-expiration
    mode: "0750"

- name: Minuterie de verrouillage
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: prestataires-expiration.service
      content: |
        [Unit]
        Description=Verrouille les prestataires dont la mission est terminée
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/prestataires-expiration
    - name: prestataires-expiration.timer
      content: |
        [Unit]
        Description=Contrôle quotidien des fins de mission
        [Timer]
        OnCalendar=*-*-* 00:05
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control: { label: "{{ item.name }}" }

- name: Activer la minuterie
  ansible.builtin.systemd:
    name: prestataires-expiration.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Contrôle - un prestataire interroge l'annuaire en chiffré (LDAPS)
  ansible.builtin.command: >
    ldapsearch -LLL -x -H ldaps://{{ ldap_fqdn }}
    -D uid={{ ldap_check_user }},ou=prestataires,{{ ldap_base_dn }} -y /dev/stdin
    -b uid={{ ldap_check_user }},ou=prestataires,{{ ldap_base_dn }} uid o description
  args:
    stdin: "{{ vault_prestataires_password }}"
    stdin_add_newline: false
  register: ldaps_check
  changed_when: false
  no_log: true

- name: Contrôle - une connexion NON chiffrée est refusée
  ansible.builtin.command: >
    ldapsearch -LLL -H ldap://{{ ldap_fqdn }} -x
    -D uid={{ ldap_check_user }},ou=prestataires,{{ ldap_base_dn }} -y /dev/stdin
    -b uid={{ ldap_check_user }},ou=prestataires,{{ ldap_base_dn }} uid
  args:
    stdin: "{{ vault_prestataires_password }}"
    stdin_add_newline: false
  register: ldap_clear_check
  changed_when: false
  failed_when: ldap_clear_check.rc == 0
  no_log: true
