- name: "{{ presta.identifiant }} : fiche"
  community.general.ldap_entry:
    dn: "uid={{ presta.identifiant }},ou=prestataires,{{ ldap_base_dn }}"
    objectClass: [inetOrgPerson, shadowAccount]
    attributes:
      uid: "{{ presta.identifiant }}"
      cn: "{{ presta.prenom }} {{ presta.nom }}"
      givenName: "{{ presta.prenom }}"
      sn: "{{ presta.nom }}"
      userPassword: "{{ vault_prestataires_password }}"
  no_log: true

- name: "{{ presta.identifiant }} : société et fin de mission"
  community.general.ldap_attrs:
    dn: "uid={{ presta.identifiant }},ou=prestataires,{{ ldap_base_dn }}"
    attributes:
      o: "{{ presta.entreprise | default('-', true) }}"
      description: "Mission TrackR jusqu'au {{ presta.fin_mission }}"
      # shadowExpire = nombre de jours depuis le 01/01/1970
      shadowExpire: "{{ ((presta.fin_mission | to_datetime('%Y-%m-%d')) - ('1970-01-01' | to_datetime('%Y-%m-%d'))).days }}"
    state: exact

- name: "{{ presta.identifiant }} : verrouillé si mission terminée ou départ"
  community.general.ldap_attrs:
    dn: "uid={{ presta.identifiant }},ou=prestataires,{{ ldap_base_dn }}"
    attributes:
      pwdAccountLockedTime: "000001010000Z"
    state: "{{ 'present' if (presta.statut != 'actif' or presta.fin_mission < now(fmt='%Y-%m-%d')) else 'absent' }}"
