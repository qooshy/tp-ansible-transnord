# Les serveurs Linux font confiance à l'Active Directory : un informaticien se
# connecte avec SON identifiant unique, et seul le groupe GG_Admins_Linux
# peut se connecter et devenir administrateur (sudo). Un départ = compte
# désactivé dans l'AD = plus d'accès nulle part.
- name: Paquets d'intégration à l'annuaire
  ansible.builtin.apt:
    name: [realmd, sssd, sssd-tools, libnss-sss, libpam-sss, adcli, samba-common-bin, krb5-user, oddjob, oddjob-mkhomedir]
    state: present

- name: Configuration Kerberos
  ansible.builtin.copy:
    dest: /etc/krb5.conf
    mode: "0644"
    content: |
      [libdefaults]
          default_realm = {{ domain_realm }}
          dns_lookup_kdc = true
          dns_lookup_realm = false
          rdns = false

- name: Le serveur est-il déjà dans le domaine ?
  ansible.builtin.command: realm list --name-only
  register: realm_list
  changed_when: false

- name: Jonction au domaine (realm join)
  ansible.builtin.shell: >
    set -o pipefail;
    echo "$JOIN_PASSWORD" | realm join --verbose --install=/
    --user=Administrator
    --computer-ou="OU=Serveurs Linux,{{ ad_root_ou }}"
    {{ domain_fqdn }}
  args:
    executable: /bin/bash
  environment:
    JOIN_PASSWORD: "{{ vault_ad_admin_password }}"
  when: domain_fqdn not in realm_list.stdout
  no_log: true

- name: Configuration SSSD
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    mode: "0600"
  notify: Redémarrer sssd

- name: Création automatique du dossier personnel
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  args:
    creates: /etc/pam.d/.transnord-mkhomedir
  register: mkhome
  notify: Marquer mkhomedir

- name: sudo pour GG_Admins_Linux (et lui seul)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gg_admins_linux
    mode: "0440"
    validate: visudo -cf %s
    content: |
      # Géré par Ansible - les membres AD de GG_Admins_Linux sont administrateurs.
      # Toutes leurs commandes sont tracées (auditd + journal central).
      Defaults:%{{ linux_admin_group | lower }} log_output, logfile=/var/log/sudo.log
      %{{ linux_admin_group | lower }} ALL=(ALL:ALL) ALL

- name: Appliquer
  ansible.builtin.meta: flush_handlers
