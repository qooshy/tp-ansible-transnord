# Les fichiers appartiennent à l'informaticien qui lance Ansible (lus pour être déployés)
pki_owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
# Un certificat par service exposé en chiffré. Calculé depuis l'inventaire :
# un nouveau contrôleur de domaine reçoit automatiquement le sien.
pki_certificates: |
  {%- set certs = [] -%}
  {%- for dc in groups['domain_controllers'] -%}
  {%-   set _ = certs.append({'name': dc, 'cn': dc ~ '.' ~ domain_fqdn, 'pfx': true,
         'sans': ['DNS:' ~ dc ~ '.' ~ domain_fqdn, 'DNS:' ~ domain_fqdn, 'DNS:' ~ dc]}) -%}
  {%- endfor -%}
  {%- for h in groups['ldap_servers'] -%}
  {%-   set _ = certs.append({'name': h, 'cn': h ~ '.' ~ domain_fqdn,
         'sans': ['DNS:' ~ h ~ '.' ~ domain_fqdn, 'DNS:' ~ h, 'IP:' ~ hostvars[h].ansible_host]}) -%}
  {%- endfor -%}
  {%- set t = ['DNS:' ~ trackr_fqdn, 'DNS:trackr', 'IP:' ~ trackr_vip] -%}
  {%- for h in groups['trackr'] -%}
  {%-   set _ = t.extend(['DNS:' ~ h ~ '.' ~ domain_fqdn, 'DNS:' ~ h, 'IP:' ~ hostvars[h].ansible_host]) -%}
  {%- endfor -%}
  {%- set _ = certs.append({'name': 'trackr', 'cn': trackr_fqdn, 'sans': t}) -%}
  {%- for h in groups['monitoring'] -%}
  {%-   set _ = certs.append({'name': h, 'cn': h ~ '.' ~ domain_fqdn,
         'sans': ['DNS:' ~ h ~ '.' ~ domain_fqdn, 'DNS:' ~ h, 'IP:' ~ hostvars[h].ansible_host]}) -%}
  {%- endfor -%}
  {{ certs }}
