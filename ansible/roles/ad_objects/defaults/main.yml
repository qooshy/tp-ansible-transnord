root_ou: "OU={{ org_name }}"

ad_desired:
  groups_ou: "OU=Groupes,{{ root_ou }}"
  ous: |
    {%- set l = [root_ou] -%}
    {%- for n in ['Utilisateurs', 'Groupes', 'Serveurs Linux', 'Desactives'] -%}
    {%-   set _ = l.append('OU=' ~ n ~ ',' ~ root_ou) -%}
    {%- endfor -%}
    {%- for s in services.values() -%}
    {%-   set _ = l.append('OU=' ~ s.ou ~ ',OU=Utilisateurs,' ~ root_ou) -%}
    {%- endfor -%}
    {{ l }}
  groups: "{{ ad_groups }}"
  users: |
    {%- set l = [] -%}
    {%- for p in employees -%}
    {%-   set actif = p.statut == 'actif' -%}
    {%-   set _ = l.append({
            'login': p.identifiant, 'first': p.prenom, 'last': p.nom,
            'department': p.service, 'enabled': actif, 'never_expires': true,
            'description': (p.service | capitalize) ~ ('' if actif else ' - parti'),
            'ou': ('OU=' ~ services[p.service].ou ~ ',OU=Utilisateurs,' ~ root_ou) if actif else ('OU=Desactives,' ~ root_ou),
            'password': vault_users_initial_password}) -%}
    {%- endfor -%}
    {{ l }}
  members: |
    {%- set m = {} -%}
    {%- for g in ad_groups -%}
    {%-   set _ = m.update({g: employees | selectattr('statut', 'eq', 'actif')
              | selectattr('service', 'in', services | dict2items | selectattr('value.groups', 'contains', g) | map(attribute='key') | list)
              | map(attribute='identifiant') | list}) -%}
    {%- endfor -%}
    {{ m }}

# Tous les serveurs + le nom de service "trackr" sur l'adresse flottante.
dns_records: |
  {%- set l = [{'name': 'trackr', 'ip': trackr_vip}] -%}
  {%- for h in groups['linux'] if h not in groups['domain_controllers'] -%}
  {%-   set _ = l.append({'name': h, 'ip': hostvars[h].ansible_host}) -%}
  {%- endfor -%}
  {{ l }}
