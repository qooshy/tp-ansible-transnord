# Sauvegarde quotidienne chiffrée de chaque serveur vers {{ backup_server }} (Lille).
- name: BorgBackup
  ansible.builtin.apt:
    name: borgbackup
    state: present

- name: Clé SSH dédiée à la sauvegarde
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_sauvegarde
    type: ed25519
    comment: "sauvegarde@{{ inventory_hostname }}"
  register: backup_key
  when: not backup_local

- name: Autoriser ce serveur à AJOUTER des sauvegardes dans SON dépôt uniquement
  ansible.posix.authorized_key:
    user: borg
    key: "{{ backup_key.public_key }}"
    key_options: >-
      command="borg serve --append-only --restrict-to-repository /srv/borg/depots/{{ inventory_hostname }}",restrict
    state: present
  delegate_to: "{{ backup_server }}"
  throttle: 1          # un serveur à la fois : même fichier sur bkp01
  when: not backup_local

- name: Empreinte du serveur de sauvegarde
  ansible.builtin.shell: ssh-keyscan -t ed25519 {{ backup_server_fqdn }} 2>/dev/null
  register: bkp_hostkey
  changed_when: false
  when: not backup_local

- name: Serveur de sauvegarde reconnu
  ansible.builtin.known_hosts:
    name: "{{ backup_server_fqdn }}"
    key: "{{ bkp_hostkey.stdout }}"
    path: /root/.ssh/known_hosts
  when: not backup_local

- name: Dossier des exports
  ansible.builtin.file:
    path: /var/backups/transnord
    state: directory
    mode: "0700"

- name: Phrase de chiffrement du dépôt
  ansible.builtin.copy:
    dest: /root/.borg-passphrase
    content: "{{ vault_borg_passphrase }}"
    mode: "0600"
  no_log: true

- name: Script de sauvegarde
  ansible.builtin.template:
    src: sauvegarde.sh.j2
    dest: /usr/local/sbin/sauvegarde
    mode: "0750"

- name: Programmation quotidienne (01:30)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: sauvegarde.service
      content: |
        [Unit]
        Description=Sauvegarde TransNord vers {{ backup_server }}
        After=network-online.target
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/sauvegarde
        SyslogIdentifier=sauvegarde
    - name: sauvegarde.timer
      content: |
        [Unit]
        Description=Sauvegarde quotidienne
        [Timer]
        OnCalendar=*-*-* 01:30
        RandomizedDelaySec=20m
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control: { label: "{{ item.name }}" }

- name: Activer la sauvegarde quotidienne
  ansible.builtin.systemd:
    name: sauvegarde.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Première sauvegarde (tant qu'aucune n'a réussi)
  ansible.builtin.shell: >
    grep -q '^backup_last_success' /var/lib/prometheus/node-exporter/sauvegarde.prom 2>/dev/null
    && echo DEJA || systemctl start sauvegarde.service
  register: first_backup
  changed_when: "'DEJA' not in first_backup.stdout"
