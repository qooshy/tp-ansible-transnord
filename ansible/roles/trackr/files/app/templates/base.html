<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrackR - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">Track<span>R</span></div>
    {% if session.user %}
    <nav>
      <a href="{{ url_for('index') }}">Expéditions</a>
      {% if session.auditor %}<a href="{{ url_for('journal') }}">Journal</a>{% endif %}
      <span class="who">{{ session.name }} · {{ session.role }}</span>
      <a href="{{ url_for('logout') }}">Déconnexion</a>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Servi par <strong id="node">{{ node }}</strong></footer>
</body>
</html>
