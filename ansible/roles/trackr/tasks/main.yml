# TrackR sur DEUX serveurs (web01, web02) :
#  - base PostgreSQL copiée en continu du principal vers le secours ;
#  - une adresse flottante (keepalived) pointe toujours vers le serveur vivant ;
#  - si le principal tombe, le secours prend l'adresse ET devient principal.
- name: Paquets
  ansible.builtin.apt:
    name: [postgresql, python3-psycopg2, python3-flask, python3-ldap3, gunicorn, nginx, keepalived]
    state: present

- name: Base de données
  ansible.builtin.import_tasks: database.yml

- name: Application
  ansible.builtin.import_tasks: app.yml

- name: Adresse flottante
  ansible.builtin.import_tasks: keepalived.yml
