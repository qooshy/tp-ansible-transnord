# Transforme ce serveur en copie fidèle du principal ({{ trackr_primary }}).
- name: Arrêt de l'application et de PostgreSQL
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: [trackr, postgresql]
  failed_when: false

- name: Ancienne copie mise de côté
  ansible.builtin.shell: |
    rm -rf {{ pg_data }}.old
    mv {{ pg_data }} {{ pg_data }}.old
    install -d -o postgres -g postgres -m 0700 {{ pg_data }}
  changed_when: true

- name: Copie complète depuis {{ trackr_primary }}
  ansible.builtin.command: >
    pg_basebackup -h {{ hostvars[trackr_primary].ansible_host }} -U replicator
    -D {{ pg_data }} -X stream -R --checkpoint=fast
  environment:
    PGPASSWORD: "{{ vault_trackr_replication_password }}"
  become_user: postgres
  changed_when: true

- name: Démarrage en mode copie
  ansible.builtin.service:
    name: postgresql
    state: started

- name: Suppression de l'ancienne copie
  ansible.builtin.file:
    path: "{{ pg_data }}.old"
    state: absent

- name: Rôle mis à jour
  ansible.builtin.set_fact:
    db_role: standby
