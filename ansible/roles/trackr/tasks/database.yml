- name: Version de PostgreSQL
  ansible.builtin.shell: ls /etc/postgresql | sort -n | tail -1
  register: pg_ver
  changed_when: false

- name: Chemins PostgreSQL
  ansible.builtin.set_fact:
    pg_conf: "/etc/postgresql/{{ pg_ver.stdout }}/main"
    pg_data: "/var/lib/postgresql/{{ pg_ver.stdout }}/main"
    pg_peers: "{{ groups['trackr'] | reject('eq', inventory_hostname) | list }}"

- name: Réglages (écoute réseau, réplication)
  ansible.builtin.copy:
    dest: "{{ pg_conf }}/conf.d/trackr.conf"
    mode: "0644"
    content: |
      # Géré par Ansible
      listen_addresses = 'localhost,{{ ansible_host }}'
      wal_level = replica
      max_wal_senders = 5
      wal_keep_size = '512MB'
      hot_standby = on
      wal_log_hints = on
      log_connections = on
      log_disconnections = on
  notify: Redémarrer postgresql

- name: Autoriser la réplication entre les serveurs TrackR
  community.postgresql.postgresql_pg_hba:
    dest: "{{ pg_conf }}/pg_hba.conf"
    contype: host
    databases: replication
    users: replicator
    source: "{{ hostvars[item].ansible_host }}/32"
    method: scram-sha-256
  loop: "{{ groups['trackr'] }}"
  notify: Recharger postgresql

- name: Appliquer
  ansible.builtin.meta: flush_handlers

- name: PostgreSQL démarré
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# ------------------------------------------------ qui est principal aujourd'hui ?
- name: État de la base sur chaque serveur
  ansible.builtin.command: >
    psql -tAc "SELECT pg_is_in_recovery()::int || ':' || (SELECT count(*) FROM pg_database WHERE datname='trackr')"
  become_user: postgres
  register: pg_state
  changed_when: false

- name: Rôle actuel de chaque base
  ansible.builtin.set_fact:
    db_role: >-
      {{ 'standby' if pg_state.stdout.split(':')[0] == '1'
         else ('primary' if pg_state.stdout.split(':')[1] == '1' else 'vierge') }}

- name: Principal du groupe
  ansible.builtin.set_fact:
    trackr_primary: >-
      {{ (groups['trackr'] | map('extract', hostvars) | selectattr('db_role', 'eq', 'primary')
          | map(attribute='inventory_hostname') | list) or [trackr_initial_primary] }}

- name: Deux bases principales en même temps = intervention humaine
  ansible.builtin.fail:
    msg: >-
      Les deux serveurs se croient principaux ({{ trackr_primary | join(', ') }}) : c'est le cas après une
      bascule. Reconstruire l'ancien principal : voir docs/RUNBOOK.md, section "TrackR après une bascule".
  when: trackr_primary | length > 1

- name: Principal retenu
  ansible.builtin.set_fact:
    trackr_primary: "{{ trackr_primary | first }}"

# ------------------------------------------------ principal
- name: Comptes de base de données
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    role_attr_flags: "{{ item.flags }}"
  loop:
    - { name: replicator, flags: "LOGIN,REPLICATION", password: "{{ vault_trackr_replication_password }}" }
    - { name: trackr, flags: "LOGIN" }
  loop_control: { label: "{{ item.name }}" }
  become_user: postgres
  when: inventory_hostname == trackr_primary
  no_log: true

- name: Base trackr
  community.postgresql.postgresql_db:
    name: trackr
    encoding: UTF-8
  become_user: postgres
  when: inventory_hostname == trackr_primary

- name: Schéma
  ansible.builtin.copy:
    src: schema.sql
    dest: /usr/local/share/trackr-schema.sql
    mode: "0644"

- name: Appliquer le schéma
  ansible.builtin.command: psql -v ON_ERROR_STOP=1 -d trackr -f /usr/local/share/trackr-schema.sql
  become_user: postgres
  when: inventory_hostname == trackr_primary
  changed_when: false

# ------------------------------------------------ secours
- name: Copier la base du principal (première installation ou reconstruction)
  ansible.builtin.include_tasks: clone.yml
  when: inventory_hostname != trackr_primary and (db_role != 'standby' or trackr_force_clone | default(false) | bool)
