- name: Compte système de l'application
  ansible.builtin.user:
    name: trackr
    system: true
    home: /opt/trackr
    shell: /usr/sbin/nologin
    create_home: false

- name: Code de l'application
  ansible.builtin.copy:
    src: app/
    dest: /opt/trackr/
    owner: root
    group: trackr
    mode: u=rwX,g=rX,o=
  notify: Redémarrer trackr

- name: Dossier de configuration
  ansible.builtin.file:
    path: /etc/trackr
    state: directory
    owner: root
    group: trackr
    mode: "0750"

- name: Configuration (secrets inclus, lisible par l'application seule)
  ansible.builtin.template:
    src: trackr.env.j2
    dest: /etc/trackr/trackr.env
    owner: root
    group: trackr
    mode: "0640"
  notify: Redémarrer trackr

- name: Service systemd
  ansible.builtin.copy:
    dest: /etc/systemd/system/trackr.service
    mode: "0644"
    content: |
      [Unit]
      Description=TrackR - suivi des expéditions
      After=network-online.target postgresql.service
      Wants=postgresql.service

      [Service]
      User=trackr
      Group=trackr
      EnvironmentFile=/etc/trackr/trackr.env
      WorkingDirectory=/opt/trackr
      ExecStart=/usr/bin/gunicorn --workers 3 --bind 127.0.0.1:8000 --access-logfile - trackr:app
      Restart=always
      RestartSec=2
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target
  notify: Redémarrer trackr

- name: Application démarrée
  ansible.builtin.systemd:
    name: trackr
    state: started
    enabled: true
    daemon_reload: true

- name: Certificat HTTPS
  ansible.builtin.copy:
    src: "{{ pki_dir }}/trackr.{{ item.ext }}"
    dest: "/etc/nginx/trackr.{{ item.ext }}"
    owner: root
    group: www-data
    mode: "{{ item.mode }}"
  loop: [{ ext: crt, mode: "0644" }, { ext: key, mode: "0640" }]
  loop_control: { label: "trackr.{{ item.ext }}" }
  notify: Recharger nginx

- name: Site web HTTPS
  ansible.builtin.template:
    src: nginx-trackr.conf.j2
    dest: /etc/nginx/sites-available/trackr
    mode: "0644"
  notify: Recharger nginx

- name: Activer le site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/trackr
    dest: /etc/nginx/sites-enabled/trackr
    state: link
  notify: Recharger nginx

- name: Retirer le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Appliquer
  ansible.builtin.meta: flush_handlers

- name: Contrôle - l'application répond
  ansible.builtin.uri:
    url: https://127.0.0.1/health
    validate_certs: false
    return_content: true
  register: trackr_health
  retries: 10
  delay: 3
  until: trackr_health.status == 200
