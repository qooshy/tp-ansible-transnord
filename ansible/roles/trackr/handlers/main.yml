- name: Redémarrer postgresql
  ansible.builtin.service: { name: postgresql, state: restarted }

- name: Recharger postgresql
  ansible.builtin.service: { name: postgresql, state: reloaded }

- name: Redémarrer trackr
  ansible.builtin.systemd: { name: trackr, state: restarted, daemon_reload: true }

- name: Recharger nginx
  ansible.builtin.service: { name: nginx, state: reloaded }

- name: Redémarrer keepalived
  ansible.builtin.service: { name: keepalived, state: restarted }
