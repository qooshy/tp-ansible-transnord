# Socle commun à TOUS les serveurs Linux : nom, heure, DNS, comptes,
# durcissement SSH, mises à jour automatiques, traces, supervision, pare-feu.
- name: Nom d'hôte
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Résolution locale du nom complet
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(127\.0\.1\.1|{{ ansible_host | regex_escape }})\s'
    line: "{{ ansible_host }} {{ fqdn }} {{ inventory_hostname }}"

- name: Fuseau horaire
  community.general.timezone:
    name: "{{ timezone_linux }}"

- name: DNS = contrôleurs de domaine (ceux du site d'abord)
  ansible.builtin.import_tasks: dns.yml
  when: inventory_hostname not in groups['domain_controllers']

- name: Disque de démarrage connu (sinon les mises à jour de GRUB échouent sur une VM clonée)
  ansible.builtin.debconf:
    name: grub-pc
    question: grub-pc/install_devices
    value: "{{ ansible_devices | dict2items | selectattr('key', 'match', '^(sd|vd|nvme)') | map(attribute='key') | map('regex_replace', '^', '/dev/') | first }}"
    vtype: multiselect

- name: Paquets de base
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Heure synchronisée sur les contrôleurs de domaine
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Redémarrer chrony

- name: Autorité de certification interne reconnue
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ ca_cert_name }}.crt"
    dest: "/usr/local/share/ca-certificates/{{ ca_cert_name }}.crt"
    mode: "0644"
  notify: Mettre à jour les autorités

- name: Compte de secours local (si l'annuaire est injoignable)
  ansible.builtin.user:
    name: secours
    comment: "Compte de secours - mot de passe dans le coffre"
    shell: /bin/bash
    groups: [sudo]
    password: "{{ vault_linux_breakglass_password | password_hash('sha512', inventory_hostname | hash('md5') | truncate(16, true, '')) }}"
    update_password: always

- name: Durcissement SSH
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-transnord.conf
    mode: "0644"
  notify: Recharger sshd

- name: Mises à jour de sécurité automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52transnord-unattended
    mode: "0644"
    content: |
      // Mises à jour de sécurité installées chaque nuit (preuve pour l'assureur :
      // /var/log/unattended-upgrades/ et le tableau de bord Grafana).
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename},label=Debian";
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Traçabilité (auditd)
  ansible.builtin.import_tasks: audit.yml

- name: Journaux envoyés au serveur central
  ansible.builtin.template:
    src: rsyslog-forward.conf.j2
    dest: /etc/rsyslog.d/90-forward.conf
    mode: "0644"
  notify: Redémarrer rsyslog
  when: inventory_hostname not in groups['monitoring']

- name: Supervision (node_exporter + métriques des mises à jour en attente)
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - prometheus-node-exporter
    - prometheus-node-exporter-apt.timer

- name: Pare-feu
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Recharger nftables

- name: Pare-feu actif au démarrage
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started

- name: Appliquer les changements maintenant
  ansible.builtin.meta: flush_handlers
