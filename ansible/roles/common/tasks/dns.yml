- name: Le DHCP (carte NAT du labo) ne doit pas écraser les DNS
  ansible.builtin.copy:
    dest: /etc/dhcp/dhclient-enter-hooks.d/zz-keep-resolv
    mode: "0644"
    content: |
      # Géré par Ansible : /etc/resolv.conf est fixé sur les contrôleurs de domaine.
      make_resolv_conf() { :; }

- name: Serveurs DNS
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Géré par Ansible (rôle common) - DC du site {{ site }} en premier
      search {{ domain_fqdn }}
      {% for ip in dns_servers %}
      nameserver {{ ip }}
      {% endfor %}
      options timeout:1 attempts:2
