# Ports ouverts en plus de SSH : chaque groupe ajoute les siens dans group_vars.
firewall_allow: []          # ex: [{port: 443, proto: tcp, from: any, comment: "web"}]
firewall_extra_rules: []    # règles nftables brutes (ex: VRRP)
firewall_forward_rules: []
firewall_nat_rules: []
monitoring_ip: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
log_server: "{{ groups['monitoring'][0] }}.{{ domain_fqdn }}"
base_packages:
  - acl
  - apt-transport-https
  - auditd
  - audispd-plugins
  - ca-certificates
  - chrony
  - curl
  - htop
  - nftables
  - prometheus-node-exporter
  - prometheus-node-exporter-collectors
  - python3-apt
  - rsyslog
  - sudo
  - unattended-upgrades
  - apt-listchanges
  - needrestart
  - vim
