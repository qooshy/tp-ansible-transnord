# Contrôleurs de domaine Active Directory (Samba AD, compatible Windows) :
# un par site, pour que chaque site continue de travailler si la liaison
# Lille <-> Dunkerque est coupée. Le premier DC de l'inventaire crée le domaine,
# les suivants le rejoignent et se répliquent avec lui.
- name: Nom d'hôte
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Nom complet résolu localement
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(127\.0\.1\.1|{{ ansible_host | regex_escape }})\s'
    line: "{{ ansible_host }} {{ fqdn }} {{ inventory_hostname }}"

- name: Domaine déjà créé ici ?
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samdb_early

- name: Si oui, l'annuaire (et donc le DNS) doit tourner avant toute chose
  ansible.builtin.systemd:
    name: samba-ad-dc
    state: started
    enabled: true
    masked: false
  when: samdb_early.stat.exists

- name: Paquets Samba AD
  ansible.builtin.apt:
    name: [samba, samba-dsdb-modules, samba-vfs-modules, winbind, libnss-winbind, krb5-user, smbclient, ldb-tools, chrony, python3-cryptography]
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Le domaine est-il déjà en place sur ce serveur ?
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samdb

- name: Services Samba "simples" arrêtés (le DC utilise samba-ad-dc)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: [smbd, nmbd, winbind]
  when: not samdb.stat.exists

- name: Ancienne configuration retirée
  ansible.builtin.file:
    path: /etc/samba/smb.conf
    state: absent
  when: not samdb.stat.exists

# ------------------------------------------------------------ premier DC
- name: Création du domaine {{ domain_fqdn }}
  ansible.builtin.command: >
    samba-tool domain provision --use-rfc2307
    --realm={{ domain_realm }} --domain={{ domain_netbios }}
    --server-role=dc --dns-backend=SAMBA_INTERNAL
    --host-ip={{ ansible_host }}
    --adminpass={{ vault_ad_admin_password | quote }}
    --option="interfaces=lo {{ ansible_host }}"
    --option="bind interfaces only=yes"
    --option="dns forwarder={{ dns_forwarders | join(' ') }}"
  when: not samdb.stat.exists and inventory_hostname == pdc
  no_log: true

# ------------------------------------------------------------ DC suivants
- name: DNS provisoire vers le premier DC (pour le trouver)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: "search {{ domain_fqdn }}\nnameserver {{ hostvars[pdc].ansible_host }}\n"
    mode: "0644"
  when: not samdb.stat.exists and inventory_hostname != pdc

- name: Kerberos provisoire
  ansible.builtin.copy:
    dest: /etc/krb5.conf
    content: "[libdefaults]\n    default_realm = {{ domain_realm }}\n    dns_lookup_kdc = true\n    dns_lookup_realm = false\n"
    mode: "0644"
  when: not samdb.stat.exists and inventory_hostname != pdc

- name: Jonction comme contrôleur supplémentaire (site {{ sites[site].label }})
  ansible.builtin.command: >
    samba-tool domain join {{ domain_fqdn }} DC
    -U Administrator --password={{ vault_ad_admin_password | quote }}
    --site={{ sites[site].label }}
    --dns-backend=SAMBA_INTERNAL
    --option="interfaces=lo {{ ansible_host }}"
    --option="bind interfaces only=yes"
    --option="dns forwarder={{ dns_forwarders | join(' ') }}"
  when: not samdb.stat.exists and inventory_hostname != pdc
  no_log: true

- name: Démarrer l'annuaire dès sa création
  ansible.builtin.systemd:
    name: samba-ad-dc
    state: started
    enabled: true
    masked: false

# ------------------------------------------------------------ commun
- name: Kerberos du domaine
  ansible.builtin.copy:
    src: /var/lib/samba/private/krb5.conf
    dest: /etc/krb5.conf
    remote_src: true
    mode: "0644"

- name: Le DC s'utilise lui-même comme DNS
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Géré par Ansible
      search {{ domain_fqdn }}
      nameserver {{ ansible_host }}
      {% for dc in groups['domain_controllers'] if dc != inventory_hostname %}
      nameserver {{ hostvars[dc].ansible_host }}
      {% endfor %}

- name: Le DHCP (carte NAT du labo) ne doit pas écraser les DNS
  ansible.builtin.copy:
    dest: /etc/dhcp/dhclient-enter-hooks.d/zz-keep-resolv
    mode: "0644"
    content: "make_resolv_conf() { :; }\n"

- name: Certificats (LDAP chiffré, port 636)
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "/var/lib/samba/private/tls/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ ca_cert_name }}.crt", dest: transnord-ca.pem, mode: "0644" }
    - { src: "{{ inventory_hostname }}.crt", dest: transnord-cert.pem, mode: "0644" }
    - { src: "{{ inventory_hostname }}.key", dest: transnord-key.pem, mode: "0600" }
  loop_control: { label: "{{ item.dest }}" }
  notify: Redémarrer samba

- name: Réglages du domaine (TLS, journalisation des connexions)
  community.general.ini_file:
    path: /etc/samba/smb.conf
    section: global
    option: "{{ item.o }}"
    value: "{{ item.v }}"
    mode: "0644"
  loop:
    - { o: tls enabled, v: "yes" }
    - { o: tls keyfile, v: /var/lib/samba/private/tls/transnord-key.pem }
    - { o: tls certfile, v: /var/lib/samba/private/tls/transnord-cert.pem }
    - { o: tls cafile, v: /var/lib/samba/private/tls/transnord-ca.pem }
    - { o: logging, v: "syslog@1 file" }
    - { o: log level, v: "1 auth_audit:3 auth_json_audit:0" }
  loop_control: { label: "{{ item.o }}" }
  notify: Redémarrer samba

- name: Partage confidentiel Paie (premier DC)
  ansible.builtin.import_tasks: paie.yml
  when: inventory_hostname == pdc

- name: Service samba-ad-dc actif
  ansible.builtin.systemd:
    name: samba-ad-dc
    state: started
    enabled: true
    masked: false

- name: Appliquer
  ansible.builtin.meta: flush_handlers

- name: Attendre que l'annuaire réponde
  ansible.builtin.command: samba-tool domain info {{ ansible_host }}
  register: dinfo
  retries: 20
  delay: 3
  until: dinfo.rc == 0
  changed_when: false

- name: Sites AD et sous-réseaux (premier DC)
  ansible.builtin.shell: |
    set -e
    CFG="CN=Sites,CN=Configuration,{{ domain_dn }}"
    has() { ldbsearch -H /var/lib/samba/private/sam.ldb -s base -b "$1" dn 2>/dev/null | grep -q '^dn:'; }
    CHANGED=0
    {% for name, s in sites.items() %}
    {% set label = 'Default-First-Site-Name' if name == hostvars[pdc].site else s.label %}
    has "CN={{ label }},$CFG" || { samba-tool sites create '{{ label }}' >/dev/null; CHANGED=1; }
    has "CN={{ s.subnet }},CN=Subnets,$CFG" || { samba-tool sites subnet create '{{ s.subnet }}' '{{ label }}' >/dev/null; CHANGED=1; }
    {% endfor %}
    echo "CHANGED=$CHANGED"
  register: sites_out
  changed_when: "'CHANGED=1' in sites_out.stdout"
  when: inventory_hostname == pdc
