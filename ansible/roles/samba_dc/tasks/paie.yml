# Fiches de paie : accessibles UNIQUEMENT aux RH et à la Direction.
# - contrôle d'accès par groupe AD, partage invisible pour les autres
# - chiffrement SMB3 obligatoire
# - chaque ouverture/modification/suppression est journalisée avec le nom de la personne,
#   et chaque refus de connexion aussi (journal central sur ops01)
- name: Compte technique propriétaire des fichiers
  ansible.builtin.user:
    name: paie
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Dossier Paie (fermé à tout le monde sur le serveur)
  ansible.builtin.file:
    path: "{{ paie_path }}"
    state: directory
    owner: paie
    group: paie
    mode: "0700"

- name: Fiche de démonstration
  ansible.builtin.copy:
    dest: "{{ paie_path }}/Fiche_paie_2026-10_Durand.txt"
    owner: paie
    group: paie
    mode: "0600"
    force: false
    content: |
      TransNord - Bulletin de paie (DEMONSTRATION)
      Salarie : Marc Durand - Periode : octobre 2026
      Salaire brut : 0 000,00 EUR

- name: Partage \\{{ inventory_hostname }}\Paie
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} PARTAGE PAIE (géré par Ansible)"
    block: |
      [Paie]
          comment = Fiches de paie - RH et Direction uniquement
          path = {{ paie_path }}
          valid users = {% for g in paie_groups %}@"{{ domain_netbios }}\{{ g }}" {% endfor %}

          read only = no
          browseable = no
          access based share enum = yes
          smb encrypt = required
          force user = paie
          force group = paie
          create mask = 0600
          directory mask = 0700
          vfs objects = full_audit
          full_audit:prefix = %u|%I|%S
          full_audit:success = connect disconnect openat renameat unlinkat mkdirat
          full_audit:failure = connect openat
          full_audit:facility = local5
          full_audit:priority = notice
  notify: Redémarrer samba
