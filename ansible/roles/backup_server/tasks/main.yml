# Serveur de sauvegarde, à LILLE (hors du site où sont les serveurs) :
# un incendie ou un vol à Dunkerque ne fait pas perdre les données.
# Les machines ne peuvent qu'AJOUTER des sauvegardes (mode "append-only") :
# un pirate qui prend la main sur un serveur ne peut pas effacer ses sauvegardes.
- name: BorgBackup
  ansible.builtin.apt:
    name: [borgbackup]
    state: present

- name: Compte de sauvegarde
  ansible.builtin.user:
    name: borg
    home: /srv/borg
    shell: /bin/bash
    system: true

- name: Dossier des dépôts
  ansible.builtin.file:
    path: /srv/borg/depots
    state: directory
    owner: borg
    group: borg
    mode: "0700"
