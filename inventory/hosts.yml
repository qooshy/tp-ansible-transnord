---
# Toutes les machines de LogiNord.
# ansible_host = l'IP de l'interface NAT de chaque VM (à changer chez vous) :
# elle vit ici, et plus dans host_vars, pour que le labo (lab/inventory.yml)
# puisse réutiliser exactement les mêmes host_vars avec ses propres adresses.
all:
  children:
    site_a:
      hosts:
        rtr-a: { ansible_host: 192.168.1.201 }
        dc01: { ansible_host: 192.168.1.210 }
        bkp01: { ansible_host: 192.168.1.212 }   # copie des sauvegardes hors de Dunkerque (MC11)
        # fs01:      # MC10 : les partages de fichiers
    site_b:
      hosts:
        rtr-b: { ansible_host: 192.168.1.202 }
        dc02: { ansible_host: 192.168.1.211 }
        web01: { ansible_host: 192.168.1.220 }   # MC11 : l'appli TrackR
        db01: { ansible_host: 192.168.1.221 }    # MC11 : la base PostgreSQL
        mon01: { ansible_host: 192.168.1.230 }   # MC15 : supervision et journaux
        ldap01: { ansible_host: 192.168.1.231 }  # MC07 : l'annuaire des prestataires
    linux:
      hosts:
        rtr-a:
        rtr-b:
        web01:
        db01:
        mon01:
        ldap01:
        bkp01:
    routers:
      hosts:
        rtr-a:
        rtr-b:
    linux_servers:
      hosts:
        web01:
        db01:
        mon01:
        ldap01:
        bkp01:
    windows:
      hosts:
        dc01:
        dc02:
        # fs01:
    dcs:
      children:
        ad_primary:
          hosts:
            dc01:
        ad_replicas:
          hosts:
            dc02:
    # --- Rôles applicatifs (MC6 à MC15) ---
    trackr:
      hosts: { web01: }
    databases:
      hosts: { db01: }
    ldap_servers:
      hosts: { ldap01: }
    monitoring:
      hosts: { mon01: }
    backup_servers:
      hosts: { bkp01: }
